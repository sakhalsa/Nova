    JiraConfig:
      type: object
      required: [domain, email, apiToken, projectKey]
      properties:
        domain:
          type: string
        email:
          type: string
        apiToken:
          type: string
        projectKey:
          type: string

    JellyfishConfig:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string

    OpenAIConfig:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
        orgId:
          type: string

    AnthropicConfig:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string

    GoogleAIConfig:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string

    PortkeyConfig:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string

    ConnectorConfigs:
      type: object
      description: |
        Configuration for each data source connector. Only configure the connectors
        you have credentials for. The assessment will use whatever is available.
      properties:
        github:
          $ref: '#/components/schemas/GithubConfig'
        postman:
          $ref: '#/components/schemas/PostmanConfig'
        grafana:
          $ref: '#/components/schemas/GrafanaConfig'
        datadog:
          $ref: '#/components/schemas/DatadogConfig'
        sonarqube:
          $ref: '#/components/schemas/SonarQubeConfig'
        crunch42:
          $ref: '#/components/schemas/Crunch42Config'
        pagerduty:
          $ref: '#/components/schemas/PagerDutyConfig'
        cloudflare:
          $ref: '#/components/schemas/CloudflareConfig'
        newrelic:
          $ref: '#/components/schemas/NewRelicConfig'
        splunk:
          $ref: '#/components/schemas/SplunkConfig'
        servicenow:
          $ref: '#/components/schemas/ServiceNowConfig'
        vercel:
          $ref: '#/components/schemas/VercelConfig'
        supabase:
          $ref: '#/components/schemas/SupabaseConfig'
        gitlab:
          $ref: '#/components/schemas/GitLabConfig'
        linear:
          $ref: '#/components/schemas/LinearConfig'
        jira:
          $ref: '#/components/schemas/JiraConfig'
        jellyfish:
          $ref: '#/components/schemas/JellyfishConfig'
        openai:
          $ref: '#/components/schemas/OpenAIConfig'
        anthropic:
          $ref: '#/components/schemas/AnthropicConfig'
        google_ai:
          $ref: '#/components/schemas/GoogleAIConfig'
        portkey:
          $ref: '#/components/schemas/PortkeyConfig'

    EnvironmentConfig:
      type: object
      required: [orgName, weightProfile, connectors]
      properties:
        orgName:
          type: string
          description: Organization name for reports and history
        assessorName:
          type: string
        assessmentDate:
          type: string
        weightProfile:
          $ref: '#/components/schemas/WeightProfileName'
        connectors:
          $ref: '#/components/schemas/ConnectorConfigs'
        narrativeProfile:
          $ref: '#/components/schemas/NarrativeProfile'
        monthlyAiCost:
          type: number
          description: Manual fallback for monthly AI spend ($) when no cost connector is available
        baselineDefectRate:
          type: number
          description: Measured non-AI defect rate (defects/KLOC) for Q baseline
        baselineCycleTimeHours:
          type: number
          description: Measured non-AI cycle time (hours) for L baseline
        baselineSource:
          type: string
          enum: [measured, industry]
          description: Use "industry" to auto-fill baselines from DORA 2024 medians
        targetRoi:
          type: number
          default: 2.0
          description: Target ROI multiplier for C-score normalization
        hourlyRate:
          type: number
          default: 75
          description: Hourly developer rate ($) for labor value calculations
        telemetry:
          type: boolean
          default: false
          description: Opt-in to Postman-controlled Turbopuffer telemetry for portfolio analytics
        sEnabled:
          type: boolean
          default: false
          description: Enable Security Posture (S) supplemental scoring
        timeoutMs:
          type: integer
          default: 30000
          description: HTTP timeout for connector API calls (milliseconds)
        scoringMode:
          type: string
          enum: [strict, portfolio, auto]
          description: How Q/L baselines are chosen; auto resolves from signals and baselineSource

    AssessmentResponse:
      type: object
      required: [validation, result, durationMs]
      properties:
        validation:
          $ref: '#/components/schemas/ValidationResult'
        result:
          $ref: '#/components/schemas/CompositeResult'
        durationMs:
          type: integer
          description: Total assessment execution time in milliseconds

    ScoreRecord:
      type: object
      required: [id, schemaVersion, timestamp, orgName, weightProfile, composite, scores, s, calibrating, connectors, signals]
      properties:
        id:
          type: string
        schemaVersion:
          type: string
        timestamp:
          type: string
          format: date-time
        orgName:
          type: string
        weightProfile:
          $ref: '#/components/schemas/WeightProfileName'
        composite:
          type: number
        scores:
          type: object
          additionalProperties:
            type: number
        s:
          type: object
          properties:
            configured:
              type: boolean
            score:
              type: number
              nullable: true
        calibrating:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        connectors:
          type: object
          properties:
            connected:
              type: array
              items:
                type: string
            failed:
              type: array
              items:
                type: string
            fallback:
              type: array
              items:
                type: string
        signals:
          type: object
          additionalProperties:
            type: object
            properties:
              value:
                type: number
              source:
                type: string

    ConnectorMetadata:
      type: object
      required: [name, dimensions, requiredCredentials]
      properties:
        name:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        requiredCredentials:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: object

    ProvenanceStep:
      type: object
      required: [signal, rawValue, normalizedValue, connector, apiEndpoint, timestamp, sampleSize, formulaPosition]
      properties:
        signal:
          type: string
        rawValue: {}
        normalizedValue:
          type: number
        connector:
          type: string
        apiEndpoint:
          type: string
        timestamp:
          type: string
          format: date-time
        sampleSize:
          type: integer
        formulaPosition:
          type: string
          description: Shows where this signal appears in the formula (e.g. "R = (1 - THIS) * slo * ...")

    SimulationRequest:
      type: object
      required: [baseResult, hypothetical]
      properties:
        baseResult:
          $ref: '#/components/schemas/CompositeResult'
        hypothetical:
          type: object
          additionalProperties:
            type: number
          description: Signal key overrides (e.g. { "cfr_ai": 0.01 })
        weightProfile:
          $ref: '#/components/schemas/WeightProfileName'
        baselineDefectRate:
          type: number
        baselineCycleTimeHours:
          type: number
        monthlyAiCost:
          type: number
        targetRoi:
          type: number
        hourlyRate:
          type: number

    SimulationResult:
      type: object
      required: [original, simulated, compositeDelta, dimensionDeltas, signalOverrides, interpretation]
      properties:
        original:
          type: object
          properties:
            composite:
              type: number
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  score:
                    type: number
                  status:
                    type: string
        simulated:
          type: object
          properties:
            composite:
              type: number
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  score:
                    type: number
                  status:
                    type: string
        compositeDelta:
          type: number
        dimensionDeltas:
          type: array
          items:
            type: object
            properties:
              dimension:
                $ref: '#/components/schemas/Dimension'
              original:
                type: number
              simulated:
                type: number
              delta:
                type: number
              originalStatus:
                type: string
              simulatedStatus:
                type: string
        biggestMover:
          type: object
          nullable: true
          properties:
            dimension:
              $ref: '#/components/schemas/Dimension'
            delta:
              type: number
            drivenBy:
              type: array
              items:
                type: string
        signalOverrides:
          type: array
          items:
            type: object
            properties:
              signal:
                type: string
              original:
                type: number
                nullable: true
              simulated:
                type: number
              dimension:
                $ref: '#/components/schemas/Dimension'
        interpretation:
          type: string
          description: Plain-English summary of the simulation outcome

    AssessmentDiff:
      type: object
      required: [runA, runB, compositeA, compositeB, compositeDelta, dimensionDiffs, interpretation]
      properties:
        runA:
          type: object
          properties:
            id:
              type: string
            timestamp:
              type: string
            orgName:
              type: string
        runB:
          type: object
          properties:
            id:
              type: string
            timestamp:
              type: string
            orgName:
              type: string
        compositeA:
          type: number
        compositeB:
          type: number
        compositeDelta:
          type: number
        dimensionDiffs:
          type: object
          additionalProperties:
            type: object
            properties:
              dimension:
                $ref: '#/components/schemas/Dimension'
              scoreA:
                type: number
              scoreB:
                type: number
              delta:
                type: number
              statusA:
                type: string
              statusB:
                type: string
              signalChanges:
                type: array
                items:
                  type: object
                  properties:
                    signal:
                      type: string
                    valueA:
                      type: number
                      nullable: true
                    valueB:
                      type: number
                      nullable: true
                    delta:
                      type: number
                      nullable: true
                    connector:
                      type: string
                    interpretation:
                      type: string
              connectorChanges:
                type: object
                properties:
                  added:
                    type: array
                    items:
                      type: string
                  removed:
                    type: array
                    items:
                      type: string
                  unchanged:
                    type: array
                    items:
                      type: string
        modeChanged:
          type: boolean
        profileChanged:
          type: boolean
        newDimensionsScored:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        dimensionsLost:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        connectorCountDelta:
          type: integer
        interpretation:
          type: string

    SignalSpec:
      type: object
      required: [key, dimension, valueRange, unit, description]
      properties:
        key:
          type: string
        dimension:
          $ref: '#/components/schemas/Dimension'
        valueRange:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        unit:
          type: string
          enum: [ratio, hours, dollars, count, rate]
        description:
          type: string

    ConnectorContract:
      type: object
      required: [name, version, dimensions, signalsProduced, confidenceContract, requiredCredentials]
      properties:
        name:
          type: string
        version:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        signalsProduced:
          type: array
          items:
            $ref: '#/components/schemas/SignalSpec'
        confidenceContract:
          type: object
          properties:
            requiresSampleSize:
              type: boolean
            minimumSampleSize:
              type: integer
            requiresTimeWindow:
              type: boolean
            minimumTimeWindowDays:
              type: integer
        requiredCredentials:
          type: array
          items:
            type: string
        testFixture:
          type: object
          properties:
            mockConfig:
              type: object
            expectedSignals:
              type: object
              additionalProperties:
                type: number

    FormulaVersion:
      type: object
      required: [id, schemaVersion, formulas, signalKeys, changelog, previousVersion, migrationAvailable, publishedDate]
      properties:
        id:
          type: string
        schemaVersion:
          type: string
        formulas:
          type: object
          additionalProperties:
            type: string
          description: Human-readable formula for each dimension
        signalKeys:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Signal keys consumed by each dimension formula
        changelog:
          type: string
        previousVersion:
          type: string
          nullable: true
        migrationAvailable:
          type: boolean
        publishedDate:
          type: string

    MigrationRequest:
      type: object
      required: [result]
      properties:
        result:
          $ref: '#/components/schemas/CompositeResult'
        targetFormulaId:
          type: string
        baselineDefectRate:
          type: number
        baselineCycleTimeHours:
          type: number
        monthlyAiCost:
          type: number
        targetRoi:
          type: number
        hourlyRate:
          type: number

    MigrationResult:
      type: object
      required: [original, migrated, signalsPreserved, signalsLost, warnings, migrationNote]
      properties:
        original:
          type: object
          properties:
            formulaId:
              type: string
            composite:
              type: number
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  score:
                    type: number
                  status:
                    type: string
        migrated:
          type: object
          properties:
            formulaId:
              type: string
            composite:
              type: number
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  score:
                    type: number
                  status:
                    type: string
        signalsPreserved:
          type: array
          items:
            type: string
        signalsLost:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        migrationNote:
          type: string
