name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@postmanlabs'

      - name: Install dependencies
        run: npm ci

      - name: Build engine
        run: npm run build --workspace=engine

      - name: Build CLI
        run: npm run build --workspace=cli

      - name: Build MCP server
        run: npm run build --workspace=mcp-server

      - name: Publish engine
        run: npm publish --workspace=engine --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish templates
        run: npm publish --workspace=templates --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CLI
        run: npm publish --workspace=cli --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish MCP server
        run: npm publish --workspace=mcp-server --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
